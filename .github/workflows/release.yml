name: Release

# Push a tag like v1.0.0 to build EmuDroid-Setup.exe and publish it as a GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch "<Version>$([regex]::Escape($v))</Version>") {
            Write-Error "Tag v$v does not match <Version> in Directory.Build.props. Update the version there first."
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test EmuDroid.sln -c Release

      - name: Publish app
        run: >
          dotnet publish src/EmuDroid.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\EmuDroid.iss
          $hash = (Get-FileHash installer\Output\EmuDroid-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EmuDroid-Setup.exe" | Out-File -Encoding ascii -NoNewline installer\Output\EmuDroid-Setup.exe.sha256

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "EmuDroid $v" }
          $notes += "`n`n**Download:** EmuDroid-Setup.exe below. Windows may show a SmartScreen warning because the installer is not code-signed yet: click *More info* → *Run anyway*."
          $notes | Out-File -Encoding utf8 notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          installer/Output/EmuDroid-Setup.exe installer/Output/EmuDroid-Setup.exe.sha256
          --title "EmuDroid ${{ steps.version.outputs.version }}" --notes-file notes.md
